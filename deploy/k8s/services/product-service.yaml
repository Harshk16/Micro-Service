apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: microservie-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
    spec:
      containers:
        - name: product-service
          image: microservie-rabbitmq/product-service:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: microservie-rabbitmq
spec:
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - name: http
      port: 80
      targetPort: http
